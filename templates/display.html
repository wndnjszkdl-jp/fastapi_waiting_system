<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대기번호 안내</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/common.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/display.css') }}">
</head>
<body>
  <main class="display-page">
    <header class="display-header">
      <div class="header-copy">
        <p class="eyebrow"><span class="eyebrow-mark"></span> LIVE WAITING STATUS</p>
        <h1>호출 번호를<br><span>확인해 주세요</span></h1>
        <p class="subtitle">화면에 표시된 번호와 ROOM을 확인해 주세요.</p>
      </div>

      <div class="header-actions">
        <div class="connection-pill" id="connectionStatus">
          <span class="status-dot"></span>
          <span>연결 중</span>
        </div>
        <button class="sound-button" id="enableSoundButton">소리 사용하기</button>
        <button class="fullscreen-button" id="fullscreenButton">전체 화면 <span aria-hidden="true">↗</span></button>
      </div>
    </header>

    <section class="room-grid">
      {% for room in rooms %}
      <article class="room-card room-{{ room|lower }}" id="roomCard{{ room }}">
        <div class="room-top">
          <span class="room-letter">{{ room }}</span>
          <div class="room-name">
            <span class="room-en">CONSULTATION</span>
            <span class="room-korean">{{ room }} ROOM</span>
          </div>
        </div>

        <div class="number-panel">
          <p>현재 입장 번호</p>
          <strong id="current{{ room }}">-</strong>
          <span id="waiting{{ room }}">대기 0명</span>
        </div>
      </article>
      {% endfor %}
    </section>

    <section class="announcement-panel">
      <div class="bell-icon" aria-hidden="true">●</div>
      <div>
        <p class="announcement-main" id="announcementMain">호출을 기다리고 있습니다.</p>
        <p class="announcement-sub" id="announcementSub">번호가 호출되면 띵동 소리와 음성 안내가 재생됩니다.</p>
      </div>
    </section>
  </main>

  <div class="call-overlay" id="callOverlay" aria-hidden="true">
    <div class="overlay-content">
      <p id="overlayRoom">A ROOM</p>
      <strong id="overlayNumber">1</strong>
      <span>입장해 주세요</span>
    </div>
  </div>

  <script src="{{ url_for('static', path='/js/display.js') }}"></script>
</body>
</html>
